<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6f2">
  <title>몽글몽글 벽돌깨기</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');

    :root {
      color-scheme: light;
      --ink: #51434f;
      --muted: #958694;
      --pink: #ff8ca7;
      --lavender: #b7a0ec;
      --cream: #fff6f2;
      --card: rgba(255, 255, 255, .84);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 8%, rgba(255, 218, 225, .66), transparent 32%),
        radial-gradient(ellipse at 92% 18%, rgba(228, 219, 255, .72), transparent 34%),
        linear-gradient(145deg, #fff9f4, #f7f1ff 60%, #fff4f7);
      font-family: "Noto Sans KR", sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(100% - 32px, 1060px);
      margin: 0 auto;
      padding: 32px 0 24px;
    }

    .topbar, .brand, .stats, .stat, .actions, .game-heading, .game-footer {
      display: flex;
      align-items: center;
    }

    .topbar, .game-heading, .game-footer { justify-content: space-between; }
    .topbar { margin: 0 6px 22px; }
    .brand { gap: 12px; }
    .brand-mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 3px solid white;
      border-radius: 17px;
      background: linear-gradient(145deg, #ffd6df, #d7c8ff);
      box-shadow: 0 8px 18px rgba(190, 153, 182, .2);
      font-size: 25px;
      transform: rotate(-5deg);
    }

    .brand-name {
      margin: 0;
      font-family: "Jua", sans-serif;
      font-size: clamp(21px, 3vw, 28px);
      letter-spacing: -.5px;
    }

    .brand-tagline { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .stats { gap: 10px; }
    .stat {
      min-width: 88px;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 5px 16px rgba(133, 108, 140, .08);
    }
    .stat-icon { font-size: 18px; }
    .stat-label { color: var(--muted); font-size: 10px; line-height: 1.1; }
    .stat-value { margin-top: 2px; font-size: 15px; font-weight: 800; }

    .game-card {
      padding: 18px;
      border: 1px solid rgba(255,255,255,.88);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 24px 65px rgba(121, 91, 132, .13), inset 0 1px white;
      backdrop-filter: blur(14px);
    }

    .game-heading { padding: 0 7px 14px; }
    .game-heading h2 { margin: 0; font-family: "Jua", sans-serif; font-size: 19px; }
    .game-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .actions { gap: 8px; }
    .icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--ink);
      border: 1px solid #f0e8f0;
      border-radius: 13px;
      background: white;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
    }
    .icon-button:hover { transform: translateY(-2px); box-shadow: 0 5px 12px #e8dbe9; }

    .canvas-wrap {
      position: relative;
      overflow: hidden;
      border: 5px solid white;
      border-radius: 20px;
      background: #fff9fc;
      box-shadow: inset 0 0 25px rgba(232, 210, 239, .18), 0 7px 20px rgba(103, 78, 115, .1);
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: auto; }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(255, 249, 252, .58);
      backdrop-filter: blur(5px);
      transition: opacity .2s, visibility .2s;
    }
    .overlay.hidden { visibility: hidden; opacity: 0; pointer-events: none; }
    .dialog {
      width: min(100%, 390px);
      padding: 25px 24px 22px;
      text-align: center;
      border: 1px solid white;
      border-radius: 25px;
      background: rgba(255,255,255,.93);
      box-shadow: 0 16px 48px rgba(106, 78, 125, .17);
      animation: pop .45s cubic-bezier(.2,.8,.3,1.15) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
    .dialog-art { margin-bottom: 4px; font-size: 45px; }
    .dialog h1 { margin: 0; font-family: "Jua", sans-serif; font-size: clamp(24px, 5vw, 32px); }
    .dialog p { margin: 9px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.65; white-space: pre-line; }
    .primary-button {
      min-width: 180px;
      padding: 12px 22px;
      color: white;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(100deg, #ff91aa, #bf9bea);
      box-shadow: 0 7px 16px rgba(211, 143, 190, .34);
      cursor: pointer;
      font-weight: 800;
      transition: transform .18s, filter .18s;
    }
    .primary-button:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .game-footer { padding: 14px 5px 0; color: var(--muted); font-size: 11px; }
    .game-footer span:last-child { color: #bd9cb8; }
    .mobile-help { display: none; }
    .sparkle { position: fixed; z-index: -1; opacity: .45; pointer-events: none; }
    .sparkle.one { top: 18%; left: 4%; font-size: 26px; }
    .sparkle.two { top: 39%; right: 5%; font-size: 21px; }
    .sparkle.three { bottom: 13%; left: 11%; font-size: 19px; }

    @media (max-width: 650px) {
      .page { width: min(100% - 18px, 520px); padding-top: 17px; }
      .topbar { align-items: flex-start; gap: 12px; margin: 0 3px 16px; }
      .brand { gap: 8px; }
      .brand-mark { width: 40px; height: 40px; border-radius: 14px; font-size: 21px; }
      .brand-tagline { font-size: 10px; }
      .stats { gap: 5px; }
      .stat { min-width: 0; gap: 4px; padding: 7px 8px; border-radius: 12px; }
      .stat-icon { font-size: 14px; }
      .stat-label { font-size: 8px; }
      .stat-value { font-size: 12px; }
      .game-card { padding: 9px; border-radius: 21px; }
      .game-heading { padding: 2px 4px 10px; }
      .game-heading h2 { font-size: 16px; }
      .game-heading p { display: none; }
      .icon-button { width: 34px; height: 34px; }
      .canvas-wrap { border-width: 3px; border-radius: 15px; }
      .game-footer { padding: 10px 3px 2px; font-size: 10px; }
      .mobile-help { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <span class="sparkle one" aria-hidden="true">✦</span>
  <span class="sparkle two" aria-hidden="true">✧</span>
  <span class="sparkle three" aria-hidden="true">♡</span>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🧸</div>
        <div>
          <p class="brand-name">몽글몽글 벽돌깨기</p>
          <p class="brand-tagline">포근한 구름 나라에서 반짝반짝!</p>
        </div>
      </div>
      <div class="stats" aria-label="게임 정보">
        <div class="stat"><span class="stat-icon" aria-hidden="true">⭐</span><div><div class="stat-label">점수</div><div class="stat-value" id="score">0000</div></div></div>
        <div class="stat"><span class="stat-icon" aria-hidden="true">💗</span><div><div class="stat-label">목숨</div><div class="stat-value" id="lives">3</div></div></div>
        <div class="stat"><span class="stat-icon" aria-hidden="true">🌈</span><div><div class="stat-label">스테이지</div><div class="stat-value" id="level">1 / 3</div></div></div>
      </div>
    </header>

    <section class="game-card" aria-label="벽돌깨기 게임">
      <div class="game-heading">
        <div>
          <h2>구름 친구들을 만나러 가요!</h2>
          <p>통통 튀는 별공으로 알록달록 블록을 깨 주세요.</p>
        </div>
        <div class="actions">
          <button class="icon-button" id="soundButton" type="button" aria-label="소리 켜기" title="소리 켜기">♪</button>
          <button class="icon-button" id="pauseButton" type="button" aria-label="일시정지" title="일시정지">Ⅱ</button>
        </div>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="game" width="960" height="600" aria-label="벽돌깨기 게임 화면"></canvas>
        <div class="overlay" id="overlay">
          <div class="dialog">
            <div class="dialog-art" id="dialogArt" aria-hidden="true">🐻‍❄️</div>
            <h1 id="dialogTitle">준비됐나요?</h1>
            <p id="dialogText">별공을 튕겨서 블록을 모두 깨 보세요!
마우스·터치로 움직이고, 클릭해서 출발해요.</p>
            <button class="primary-button" id="startButton" type="button">게임 시작하기 ✨</button>
          </div>
        </div>
      </div>
      <div class="game-footer">
        <span>⌨️ ← → 방향키로 움직이기 · 스페이스로 시작/일시정지</span>
        <span class="mobile-help">손가락으로 좌우 이동 · 화면을 톡 눌러 출발</span>
        <span>작은 별을 잡으면 패들이 커져요! 🌟</span>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const wrap = document.querySelector("#canvasWrap");
      const overlay = document.querySelector("#overlay");
      const title = document.querySelector("#dialogTitle");
      const text = document.querySelector("#dialogText");
      const art = document.querySelector("#dialogArt");
      const startButton = document.querySelector("#startButton");
      const scoreDisplay = document.querySelector("#score");
      const livesDisplay = document.querySelector("#lives");
      const levelDisplay = document.querySelector("#level");
      const pauseButton = document.querySelector("#pauseButton");
      const soundButton = document.querySelector("#soundButton");

      const W = canvas.width;
      const H = canvas.height;
      const colors = ["#ff9eb3", "#ffc58e", "#ffe187", "#9cddc6", "#b9a7f4"];
      const state = {
        mode: "ready",
        score: 0,
        lives: 3,
        level: 1,
        sound: false,
        paddle: { x: W / 2 - 68, y: H - 54, w: 136, h: 17, speed: 8 },
        ball: { x: W / 2, y: H - 79, r: 11, vx: 0, vy: 0, stuck: true },
        bricks: [],
        particles: [],
        drops: [],
        keys: new Set(),
        lastTime: 0,
        pointerX: null,
        trail: [],
        audio: null
      };

      function makeBricks() {
        state.bricks = [];
        const cols = 10;
        const rows = 5;
        const gap = 9;
        const margin = 54;
        const brickW = (W - margin * 2 - gap * (cols - 1)) / cols;
        const brickH = 29;
        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < cols; col += 1) {
            if (state.level === 3 && row === 2 && (col === 0 || col === cols - 1)) continue;
            state.bricks.push({
              x: margin + col * (brickW + gap),
              y: 91 + row * (brickH + gap),
              w: brickW,
              h: brickH,
              hp: row < Math.min(state.level - 1, 2) ? 2 : 1,
              color: colors[(row + col + state.level - 1) % colors.length],
              alive: true,
              phase: Math.random() * Math.PI * 2
            });
          }
        }
      }

      function updateHud() {
        scoreDisplay.textContent = String(state.score).padStart(4, "0");
        livesDisplay.textContent = String(state.lives);
        levelDisplay.textContent = `${state.level} / 3`;
      }

      function resetBall() {
        state.ball.x = state.paddle.x + state.paddle.w / 2;
        state.ball.y = state.paddle.y - state.ball.r - 3;
        state.ball.vx = 0;
        state.ball.vy = 0;
        state.ball.stuck = true;
        state.trail = [];
      }

      function resetGame() {
        state.score = 0;
        state.lives = 3;
        state.level = 1;
        state.paddle.w = 136;
        state.paddle.x = W / 2 - state.paddle.w / 2;
        state.drops = [];
        state.particles = [];
        makeBricks();
        resetBall();
        updateHud();
        setMode("ready");
      }

      function setMode(mode) {
        state.mode = mode;
        const messages = {
          ready: ["🐻‍❄️", "준비됐나요?", "별공을 튕겨서 블록을 모두 깨 보세요!\n마우스·터치로 움직이고, 클릭해서 출발해요.", "게임 시작하기 ✨"],
          paused: ["☁️", "잠깐 쉬어 가요", "준비되면 계속 이어서 플레이해요!", "계속하기 💫"],
          won: ["🎉", "우와, 완벽해요!", `세 스테이지를 모두 통과했어요!\n최종 점수 ${state.score}점 · 구름 친구들이 축하해요!`, "다시 플레이하기 🎀"],
          lost: ["🧸", "괜찮아요, 다시 해봐요!", `이번 점수는 ${state.score}점이에요.\n한 번 더 하면 분명 더 잘할 수 있어요!`, "다시 도전하기 💪"]
        };
        const message = messages[mode];
        if (message) {
          [art.textContent, title.textContent, text.textContent, startButton.textContent] = message;
          overlay.classList.remove("hidden");
        } else {
          overlay.classList.add("hidden");
        }
        pauseButton.setAttribute("aria-label", mode === "paused" ? "계속하기" : "일시정지");
      }

      function launch() {
        if (!state.ball.stuck || state.mode === "paused") return;
        state.ball.stuck = false;
        state.ball.vx = (Math.random() * 2 - 1) * 3.2;
        state.ball.vy = -(6.1 + state.level * .35);
        setMode("playing");
      }

      function beep(frequency = 520, duration = .06) {
        if (!state.sound) return;
        try {
          state.audio ??= new AudioContext();
          const oscillator = state.audio.createOscillator();
          const gain = state.audio.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(.045, state.audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, state.audio.currentTime + duration);
          oscillator.connect(gain);
          gain.connect(state.audio.destination);
          oscillator.start();
          oscillator.stop(state.audio.currentTime + duration);
        } catch (error) {
          console.warn("게임 소리를 재생하지 못했습니다.", error);
          state.sound = false;
          soundButton.textContent = "♪";
          soundButton.setAttribute("aria-label", "소리 켜기");
        }
      }

      function burst(x, y, color, count = 9) {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.2 + Math.random() * 3.6;
          state.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: 2 + Math.random() * 4,
            color
          });
        }
      }

      function addDrop(x, y) {
        if (Math.random() < .14) state.drops.push({ x, y, vy: 2.1, r: 13, phase: Math.random() * 6 });
      }

      function advanceLevel() {
        if (state.level >= 3) {
          setMode("won");
          return;
        }
        state.level += 1;
        state.paddle.w = Math.max(105, state.paddle.w - 8);
        state.paddle.x = (W - state.paddle.w) / 2;
        makeBricks();
        resetBall();
        updateHud();
        setMode("ready");
        title.textContent = `스테이지 ${state.level}!`;
        art.textContent = ["", "🌤️", "🌈", "✨"][state.level];
        text.textContent = "점점 더 멋진 블록이 나타나요!\n새 별공을 톡 쳐서 시작해요.";
      }

      function loseLife() {
        state.lives -= 1;
        updateHud();
        burst(state.ball.x, state.ball.y, "#ff9eb3", 15);
        beep(220, .15);
        if (state.lives <= 0) {
          setMode("lost");
        } else {
          resetBall();
          setMode("ready");
          art.textContent = "💞";
          title.textContent = "앗, 별공이 떨어졌어요!";
          text.textContent = `괜찮아요! 하트가 ${state.lives}개 남았어요.\n다시 톡 눌러서 출발해요.`;
          startButton.textContent = "계속하기 💪";
        }
      }

      function collideBrick(ball, brick) {
        const closestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.w));
        const closestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.h));
        const dx = ball.x - closestX;
        const dy = ball.y - closestY;
        if (dx * dx + dy * dy > ball.r * ball.r) return false;
        if (Math.abs(dx) > Math.abs(dy)) ball.vx = Math.abs(ball.vx) * (dx < 0 ? -1 : 1);
        else ball.vy = Math.abs(ball.vy) * (dy < 0 ? -1 : 1);
        brick.hp -= 1;
        if (brick.hp <= 0) {
          brick.alive = false;
          state.score += 10 * state.level;
          burst(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color);
          addDrop(brick.x + brick.w / 2, brick.y + brick.h / 2);
          updateHud();
        } else {
          state.score += 3;
          updateHud();
          burst(closestX, closestY, "#fff", 4);
        }
        beep(brick.hp > 0 ? 660 : 820);
        return true;
      }

      function update(delta) {
        const step = Math.min(delta / 16.667, 2);
        if (state.mode !== "playing") {
          if (state.ball.stuck) {
            state.ball.x = state.paddle.x + state.paddle.w / 2;
            state.ball.y = state.paddle.y - state.ball.r - 3;
          }
          return;
        }

        const paddle = state.paddle;
        if (state.pointerX !== null) {
          paddle.x += (state.pointerX - paddle.w / 2 - paddle.x) * Math.min(.3 * step, 1);
        } else {
          if (state.keys.has("ArrowLeft") || state.keys.has("a")) paddle.x -= paddle.speed * step;
          if (state.keys.has("ArrowRight") || state.keys.has("d")) paddle.x += paddle.speed * step;
        }
        paddle.x = Math.max(16, Math.min(W - paddle.w - 16, paddle.x));

        const ball = state.ball;
        ball.x += ball.vx * step;
        ball.y += ball.vy * step;
        if (ball.x - ball.r < 8) { ball.x = ball.r + 8; ball.vx = Math.abs(ball.vx); beep(360); }
        if (ball.x + ball.r > W - 8) { ball.x = W - ball.r - 8; ball.vx = -Math.abs(ball.vx); beep(360); }
        if (ball.y - ball.r < 8) { ball.y = ball.r + 8; ball.vy = Math.abs(ball.vy); beep(360); }

        if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
            ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
          const offset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const speed = Math.min(Math.hypot(ball.vx, ball.vy) + .12, 9.8);
          const angle = offset * 1.02;
          ball.vx = speed * Math.sin(angle);
          ball.vy = -Math.max(3.5, speed * Math.cos(angle));
          ball.y = paddle.y - ball.r - 1;
          beep(500);
          burst(ball.x, paddle.y, "#ffd5e0", 4);
        }
        if (ball.y - ball.r > H) { loseLife(); return; }

        for (const brick of state.bricks) {
          if (brick.alive && collideBrick(ball, brick)) break;
        }
        if (state.bricks.every((brick) => !brick.alive)) { advanceLevel(); return; }

        state.drops = state.drops.filter((drop) => {
          drop.y += drop.vy * step;
          drop.phase += .08 * step;
          if (drop.y + drop.r >= paddle.y && drop.y - drop.r <= paddle.y + paddle.h &&
              drop.x >= paddle.x && drop.x <= paddle.x + paddle.w) {
            paddle.w = Math.min(205, paddle.w + 30);
            paddle.x = Math.max(16, Math.min(W - paddle.w - 16, paddle.x - 15));
            state.score += 25;
            updateHud();
            burst(drop.x, drop.y, "#ffe187", 14);
            beep(960, .12);
            return false;
          }
          return drop.y < H + drop.r;
        });

        state.trail.push({ x: ball.x, y: ball.y, life: 1 });
        if (state.trail.length > 7) state.trail.shift();
        state.particles = state.particles.filter((particle) => {
          particle.x += particle.vx * step;
          particle.y += particle.vy * step;
          particle.vy += .045 * step;
          particle.life -= .025 * step;
          return particle.life > 0;
        });
      }

      function drawBackground(time) {
        ctx.clearRect(0, 0, W, H);
        const gradient = ctx.createLinearGradient(0, 0, W, H);
        gradient.addColorStop(0, "#fff9fc");
        gradient.addColorStop(1, "#f9f5ff");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 36; i += 1) {
          const x = (i * 173 + 47) % W;
          const y = (i * 97 + 33) % H;
          const twinkle = .25 + (Math.sin(time / 900 + i * 1.7) + 1) * .18;
          ctx.globalAlpha = twinkle;
          ctx.fillStyle = i % 3 === 0 ? "#e8b7cf" : "#b6a9df";
          ctx.beginPath();
          ctx.arc(x, y, i % 4 === 0 ? 2 : 1.3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = "rgba(255,255,255,.42)";
        ctx.beginPath();
        ctx.ellipse(145, 30, 185, 43, 0, 0, Math.PI * 2);
        ctx.ellipse(810, 575, 205, 50, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
      }

      function draw(time) {
        drawBackground(time);
        for (const brick of state.bricks) {
          if (!brick.alive) continue;
          const bob = Math.sin(time / 700 + brick.phase) * 1.1;
          ctx.save();
          ctx.shadowColor = `${brick.color}88`;
          ctx.shadowBlur = 11;
          roundedRect(brick.x, brick.y + bob, brick.w, brick.h, 10);
          ctx.fillStyle = brick.color;
          ctx.fill();
          ctx.shadowBlur = 0;
          roundedRect(brick.x + 3, brick.y + bob + 3, brick.w - 6, 7, 5);
          ctx.fillStyle = "rgba(255,255,255,.38)";
          ctx.fill();
          if (brick.hp > 1) {
            ctx.fillStyle = "rgba(255,255,255,.86)";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("✦", brick.x + brick.w / 2, brick.y + bob + 21);
          }
          ctx.restore();
        }

        for (const drop of state.drops) {
          ctx.save();
          ctx.translate(drop.x, drop.y);
          ctx.rotate(Math.sin(drop.phase) * .16);
          ctx.shadowColor = "#e6bc73";
          ctx.shadowBlur = 12;
          ctx.fillStyle = "#fff0a8";
          ctx.beginPath();
          ctx.arc(0, 0, drop.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.font = "17px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("★", 0, 1);
          ctx.restore();
        }

        for (const particle of state.particles) {
          ctx.globalAlpha = particle.life;
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size * particle.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (const trail of state.trail) {
          ctx.globalAlpha = trail.life * .15;
          ctx.fillStyle = "#ff9eb3";
          ctx.beginPath();
          ctx.arc(trail.x, trail.y, state.ball.r * trail.life, 0, Math.PI * 2);
          ctx.fill();
          trail.life -= .12;
        }
        state.trail = state.trail.filter((item) => item.life > 0);
        ctx.globalAlpha = 1;

        const paddle = state.paddle;
        ctx.save();
        ctx.shadowColor = "#c6a4e7";
        ctx.shadowBlur = 15;
        roundedRect(paddle.x, paddle.y, paddle.w, paddle.h, 10);
        const paddleGradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.w, paddle.y);
        paddleGradient.addColorStop(0, "#f6a0bc");
        paddleGradient.addColorStop(.52, "#c2a2eb");
        paddleGradient.addColorStop(1, "#a1cfee");
        ctx.fillStyle = paddleGradient;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,.58)";
        roundedRect(paddle.x + 9, paddle.y + 3, paddle.w - 18, 4, 3);
        ctx.fill();
        ctx.restore();

        const ball = state.ball;
        ctx.save();
        ctx.shadowColor = "#ffb8ca";
        ctx.shadowBlur = 19;
        const ballGradient = ctx.createRadialGradient(ball.x - 4, ball.y - 5, 1, ball.x, ball.y, ball.r + 2);
        ballGradient.addColorStop(0, "#fff");
        ballGradient.addColorStop(.45, "#ffdce6");
        ballGradient.addColorStop(1, "#ff91ad");
        ctx.fillStyle = ballGradient;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(ball.x - 3, ball.y - 4, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (state.mode === "ready" && !overlay.classList.contains("hidden")) {
          const hintY = Math.max(70, ball.y - 28);
          ctx.globalAlpha = .66 + Math.sin(time / 210) * .24;
          ctx.fillStyle = "#9b83af";
          ctx.font = "16px 'Noto Sans KR', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("여기를 톡 눌러요!", ball.x, hintY);
          ctx.globalAlpha = 1;
        }
      }

      function frame(time) {
        const delta = state.lastTime ? time - state.lastTime : 16.667;
        state.lastTime = time;
        update(delta);
        draw(time);
        requestAnimationFrame(frame);
      }

      function pointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return (event.clientX - rect.left) * W / rect.width;
      }

      canvas.addEventListener("pointermove", (event) => {
        state.pointerX = pointerPosition(event);
      });
      canvas.addEventListener("pointerleave", () => {
        state.pointerX = null;
      });
      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        state.pointerX = pointerPosition(event);
        if (state.mode === "ready") launch();
      });
      wrap.addEventListener("pointerdown", (event) => {
        if (event.target === canvas && state.mode === "ready") launch();
      });

      window.addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
        state.keys.add(event.key);
        if (event.key === " " || event.key === "Enter") {
          if (state.mode === "playing") setMode("paused");
          else if (state.mode === "paused") setMode("playing");
          else if (state.mode === "ready") launch();
        }
        if (event.key.toLowerCase() === "p") {
          if (state.mode === "playing") setMode("paused");
          else if (state.mode === "paused") setMode("playing");
        }
      });
      window.addEventListener("keyup", (event) => state.keys.delete(event.key));
      window.addEventListener("blur", () => {
        state.keys.clear();
        if (state.mode === "playing") setMode("paused");
      });

      startButton.addEventListener("click", () => {
        if (state.mode === "won" || state.mode === "lost") resetGame();
        if (state.mode === "ready") launch();
        else if (state.mode === "paused") setMode("playing");
      });
      pauseButton.addEventListener("click", () => {
        if (state.mode === "playing") setMode("paused");
        else if (state.mode === "paused") setMode("playing");
      });
      soundButton.addEventListener("click", () => {
        state.sound = !state.sound;
        soundButton.textContent = state.sound ? "♫" : "♪";
        soundButton.setAttribute("aria-label", state.sound ? "소리 끄기" : "소리 켜기");
        if (state.sound) beep(700, .12);
      });

      makeBricks();
      updateHud();
      resetBall();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
